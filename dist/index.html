<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PartnerAssistant PRM</title>
<meta name="description" content="Chat-first partner relationship management. Partners apply and submit deals; vendors accept and send them to Salesforce.">
<style>
:root{
 --night:#102f57;--night-2:#163d70;--brand:#0969da;--brand-hover:#0758b8;--brand-soft:#eaf2fd;
 --accent:#ffb359;--accent-soft:#fff4e5;--accent-ink:#8a4b00;
 --ink:#18181b;--text:#3f4652;--muted:#64748b;--canvas:#f5f7fb;--surface:#ffffff;--surface-2:#f8fafc;
 --border:#e2e8f0;--border-strong:#cbd5e1;
 --ok:#1a7f4b;--ok-soft:#e7f6ee;--bad:#b42318;--bad-soft:#fdecea;
 --shadow:0 1px 2px #172b4508,0 6px 18px #172b4508;--radius:14px;--ctl:9px;
 --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 color-scheme:light;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --night:#0b2140;--night-2:#123158;--brand:#4c9aff;--brand-hover:#7ab3ff;--brand-soft:#16294a;
 --accent-soft:#3a2a12;--accent-ink:#ffcf8f;--ink:#eef2f8;--text:#c7d0dd;--muted:#8f9bb0;
 --canvas:#0d1522;--surface:#152033;--surface-2:#1a2740;--border:#24324a;--border-strong:#33445f;
 --ok:#4fd18b;--ok-soft:#123323;--bad:#ff8a80;--bad-soft:#3a1717;--shadow:0 1px 2px #0006;color-scheme:dark}}
:root[data-theme="dark"]{
 --night:#0b2140;--night-2:#123158;--brand:#4c9aff;--brand-hover:#7ab3ff;--brand-soft:#16294a;
 --accent-soft:#3a2a12;--accent-ink:#ffcf8f;--ink:#eef2f8;--text:#c7d0dd;--muted:#8f9bb0;
 --canvas:#0d1522;--surface:#152033;--surface-2:#1a2740;--border:#24324a;--border-strong:#33445f;
 --ok:#4fd18b;--ok-soft:#123323;--bad:#ff8a80;--bad-soft:#3a1717;--shadow:0 1px 2px #0006;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font:15px/1.5 var(--ui);color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{color:var(--ink);margin:0;letter-spacing:-.01em}
a{color:var(--brand)}
.ask[hidden]{display:none}
.sf-cta{background:#00a1e0;color:#fff;border-color:#00a1e0;position:relative;animation:sfpulse 2.4s ease-out infinite}
.sf-cta:hover{background:#0089bf;color:#fff}
@keyframes sfpulse{0%{box-shadow:0 0 0 0 #00a1e073}70%{box-shadow:0 0 0 10px #00a1e000}100%{box-shadow:0 0 0 0 #00a1e000}}
.sf-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;margin-bottom:22px;border-radius:var(--radius);background:linear-gradient(120deg,#032d60,#0b5cab 60%,#00a1e0);color:#fff;box-shadow:var(--shadow)}
.sf-hero-ic{flex:0 0 48px;height:48px;border-radius:12px;display:grid;place-items:center;background:#ffffff26}.sf-hero-ic svg{width:30px;height:30px}
.sf-hero-copy{flex:1 1 260px;min-width:0}.sf-hero-copy b{display:block;font-size:16.5px}.sf-hero-copy span{font-size:13.5px;color:#d6eaff}
.sf-hero .sf-cta{background:#fff;color:#0b5cab;border-color:#fff;animation:none}.sf-hero .sf-cta svg path{fill:#00a1e0}
.sendchip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.src{display:inline-flex;align-items:center;gap:4px}.src .sfi{width:15px;height:15px;flex-basis:15px}
.bellwrap{position:relative}
.bell .bdot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#2a1a00;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.bell{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:45;width:min(360px,calc(100vw - 24px));max-height:440px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px #102f5733}
.pop[hidden]{display:none}
.pop header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--border)}.pop header b{color:var(--ink)}.pop header small{color:var(--muted);font-size:12px}
.pop ul{list-style:none;margin:0;padding:4px 16px 10px}.pop li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:13.5px;color:var(--ink)}.pop li:first-child{border-top:0}
.pop li:not(.new) .dot{background:var(--border-strong)}.pop time{display:block;color:var(--muted);font-size:12px}
.tl li b{color:var(--ink)}.tl li .pill{margin-left:4px;vertical-align:1px}

.card{container-type:inline-size}
.flag{white-space:nowrap}
.seg{overflow-x:auto;max-width:100%;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap}
.ph>div:first-child{min-width:0;flex:1 1 300px}.ph-acts{display:flex;gap:8px;flex-wrap:wrap}
.msg .btn{white-space:normal;text-align:left}
.modal.wide{width:min(640px,100%)}
.sf{cursor:pointer}.sf:hover{border-color:var(--brand)}
.sf-connect svg,.sfi{width:18px;height:18px;flex:0 0 18px}
.sfbar{display:flex;align-items:center;gap:10px;padding:16px 22px;background:#00a1e0;color:#fff;font-weight:700;font-size:17px}
.sfbar svg{width:30px;height:30px}
.scopes{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.scopes li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink)}
.scopes svg{width:16px;height:16px;flex:0 0 16px;margin-top:3px;color:var(--ok)}
.envs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.envs label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border-strong);border-radius:10px;cursor:pointer;font-size:13.5px}
.envs label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.envs b{display:block;color:var(--ink)}
.opps{display:grid;gap:8px;margin-top:4px}
.opp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:11px;cursor:pointer}
.opp:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opp.sent{opacity:.6;cursor:default}
.opp b{display:block;color:var(--ink);font-size:14.5px;overflow-wrap:anywhere}
.opp small{display:block;color:var(--muted);font-size:12.5px}
.opp input{width:18px;height:18px;accent-color:var(--brand)}
@media (max-width:560px){.envs{grid-template-columns:1fr}.opp{grid-template-columns:auto minmax(0,1fr)}.opp .amt{grid-column:2}}

#root{min-height:100vh}
.back svg,.flag svg{width:15px;height:15px;flex:0 0 15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 15px;border-radius:var(--ctl);font-weight:600;font-size:14px;white-space:nowrap;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-hover)}
:root[data-theme="dark"] .btn-primary{color:#06121f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#06121f}}
.btn-line{background:var(--surface);border-color:var(--border-strong);color:var(--ink)}.btn-line:hover{border-color:var(--brand);color:var(--brand)}
.btn-quiet{color:var(--muted);padding:8px 10px}.btn-quiet:hover{color:var(--ink)}
.btn-sf{background:#00a1e0;color:#fff}.btn-sf:hover{background:#0089bf}
.btn-sm{min-height:32px;padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.6;cursor:progress}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-applied,.p-submitted{background:var(--accent-soft);color:var(--accent-ink)}
.p-review{background:var(--brand-soft);color:var(--brand)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600}
.flag.ok{color:var(--ok)}.flag.warn{color:var(--accent-ink)}
.logo-mark{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--ink);letter-spacing:-.02em}
.logo-mark svg{width:26px;height:26px}
.logo-mark i{font-style:normal;color:var(--accent)}

/* ---------- sign-in ---------- */
.auth{display:grid;grid-template-columns:minmax(320px,44%) 1fr;min-height:100vh}
.auth-side{background:var(--night);color:#dbe7f7;padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side .logo-mark{color:#fff}
.auth-side h1{color:#fff;font-size:clamp(30px,3.4vw,44px);line-height:1.08;font-weight:700;margin:0 0 16px;max-width:13ch}
.auth-side p{margin:0;max-width:40ch;color:#b9cbe4}
.auth-side>*{position:relative}
.auth-side .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 380px at 85% 70%,#1f6fe055,transparent 70%),radial-gradient(420px 300px at 10% 10%,#ffb35914,transparent 70%),radial-gradient(#ffffff10 1px,transparent 1px) 0 0/22px 22px}
.auth-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.auth-tag{font-size:12.5px;font-weight:600;color:#a9bfdc;padding:4px 10px;border:1px solid #ffffff26;border-radius:999px}
.auth-copy h1{max-width:17ch;font-size:clamp(28px,3vw,40px)}
.scene{perspective:1400px;height:420px;margin:18px 0 6px;touch-action:none}
.stage{position:relative;width:470px;max-width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(calc(20deg + var(--ry,0deg))) rotateY(calc(-24deg + var(--rx,0deg)));transition:transform .3s ease-out}
.pane{--z:0px;position:absolute;width:236px;padding:14px 16px;border-radius:14px;background:linear-gradient(155deg,#2a5288f2,#163762f5);border:1px solid #ffffff2b;box-shadow:0 24px 44px #00000059;color:#dfe8f6;backdrop-filter:blur(8px);transform:translateZ(var(--z));transition:transform .35s ease,border-color .35s,box-shadow .35s;cursor:default}
.pane:hover{transform:translateZ(calc(var(--z) + 28px))}
.p1{left:0;top:0}.p2{left:110px;top:142px;--z:40px}.p3{left:220px;top:284px;--z:80px}
.pane b{display:block;color:#fff;font-size:15px;margin:4px 0 2px}
.pane small{display:block;color:#a9bfdc;font-size:12.5px}
.pane ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:12.5px;color:#cfe0f7}
.pane li{display:flex;align-items:center;gap:6px}.pane li svg{width:13px;height:13px;color:#4fd18b}
.pk{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:#8fa9cc;letter-spacing:.02em}
.pk i{width:7px;height:7px;border-radius:50%;background:#8fa9cc}
.pv{display:block;margin-top:8px;font-size:22px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.stagepill{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:#00a1e0;color:#fff;font-size:12px;font-weight:600}
.pane.on{border-color:#ffb359;box-shadow:0 0 0 1px #ffb359,0 28px 56px #00000073,0 0 46px #ffb35930}
.pane.on .pk{color:#ffb359}.pane.on .pk i{background:#ffb359;box-shadow:0 0 0 4px #ffb35933}
.pane.done .pk i{background:#4fd18b}
.auth-points{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.auth-points li{padding:12px 14px;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff0a}
.auth-points b{display:block;color:#fff;font-size:15px}.auth-points span{font-size:12.5px;color:#a9bfdc}
@media (max-width:1220px){.pane{width:206px}.p2{left:80px;top:142px}.p3{left:160px;top:284px}}
.auth-foot{font-size:12.5px;color:#8fa9cc}
.auth-main{display:grid;place-items:center;padding:40px 24px;background:var(--canvas)}
.auth-card{width:min(440px,100%)}
.auth-card h2{font-size:28px;margin:0 0 6px}
.auth-card>p{margin:0 0 24px;color:var(--muted)}
.role{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.role:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.role .ic{flex:0 0 42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.role.vendor .ic{background:var(--night);color:var(--accent)}
.role b{display:block;color:var(--ink);font-size:16px}
.role small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-bottom:18px;padding:0}
.back:hover{color:var(--ink)}
.who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--brand-soft);color:var(--ink);font-size:13.5px;margin-bottom:18px}
.idp{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 16px;border:1px solid var(--border-strong);border-radius:var(--ctl);background:var(--surface);color:var(--ink);font-weight:600;margin-bottom:10px}
.idp:hover{border-color:var(--brand)}
.idp svg{width:20px;height:20px;flex:0 0 20px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.tabs2{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:14px}
.tabs2 button{flex:1;padding:7px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fine{font-size:12.5px;color:var(--muted);margin-top:16px;text-align:center}
.waiting{display:grid;place-items:center;gap:14px;text-align:center;padding:30px 0}
.waiting .spin{width:28px;height:28px;border-width:3px;color:var(--brand)}

/* ---------- form ---------- */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field small{color:var(--muted);font-size:12px}
.input,select.input,textarea.input{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--ctl);background:var(--surface);color:var(--ink)}
textarea.input{min-height:92px;resize:vertical}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--border)}
.side .logo-mark{padding:0 8px 14px}
.org{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.av{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--brand-soft);color:var(--brand)}
.av.vendor{background:var(--night);color:var(--accent)}
.org b{display:block;color:var(--ink);font-size:14px;line-height:1.25}
.org small{color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:500;font-size:14.5px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav svg{width:19px;height:19px;flex:0 0 19px}
.nav .count{margin-left:auto;min-width:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:#2a1a00;font-size:12px;font-weight:700;text-align:center}
.side-foot{margin-top:auto;display:grid;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2)}
.me b{display:block;color:var(--ink);font-size:13.5px;line-height:1.2}
.me small{color:var(--muted);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 32px;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
body.signed::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--canvas)}
.top .crumb{font-size:14px;color:var(--muted)}.top .crumb b{color:var(--ink);font-weight:600}
.top .grow{flex:1}
.top .mlogo{display:none}
.sf{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink)}
.sf::before{content:"";width:7px;height:7px;border-radius:50%;background:#22a06b}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--muted);border:1px solid var(--border);background:var(--surface)}
.iconbtn:hover{color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.page{width:100%;max-width:1120px;margin:0 auto;padding:30px 32px 110px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:28px;line-height:1.15}
.ph p{margin:6px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}
.stat{display:block;text-align:left;padding:18px 20px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-decoration:none;color:inherit}
a.stat:hover{border-color:var(--brand)}
.stat span{font-size:13px;color:var(--muted);font-weight:500}
.stat strong{display:block;margin:6px 0 2px;font-size:30px;line-height:1.1;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12.5px}
.stat.hero{background:var(--night);border-color:var(--night);color:#dbe7f7}
.stat.hero span,.stat.hero small{color:#a9bfdc}.stat.hero strong{color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-h h2{font-size:16.5px}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg em{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--border)}
.row:first-child{border-top:0}
.row.hl{animation:hl 2.2s ease-out}
@keyframes hl{0%{background:var(--accent-soft)}100%{background:transparent}}
.rmain{display:flex;align-items:center;gap:12px;min-width:0;text-align:left;padding:0}
.rmain:hover b{color:var(--brand)}

const prog=id=>db.programs.find(p=>p.id===id)||{};
const vendorOf=d=>prog(d.program).vendor;
const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v||0);
const short=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:1}).format(v||0);
const date=s=>new Date(s.length===10?s+'T12:00:00':s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const ago=s=>{const m=Math.round((Date.now()-Date.parse(s))/6e4);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';const d=Math.round(h/24);return d<30?d+(d===1?' day ago':' days ago'):date(s)};
const ini=n=>String(n).split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const hostOf=s=>String(s||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0].trim();
const uid=p=>p+(++db.seq);
function log(vendor,partner,text){db.activity.unshift({at:new Date().toISOString(),vendor,partner,text});db.activity=db.activity.slice(0,40)}
const me=()=>USERS[session.role];
const myCo=()=>me().company;

/* scoped data */
const V={
 memberships:()=>db.memberships.filter(m=>prog(m.program).vendor===myCo()),
 waiting:()=>V.memberships().filter(m=>['Applied','Under review'].includes(m.status)).sort((a,b)=>a.appliedAt.localeCompare(b.appliedAt)),
 deals:()=>db.deals.filter(d=>vendorOf(d)===myCo()),
 newDeals:()=>V.deals().filter(d=>d.status==='Submitted').sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt)),
 partners:()=>[...new Set(V.memberships().filter(m=>m.status==='Accepted').map(m=>m.partner))],
 programs:()=>db.programs.filter(p=>p.vendor===myCo())};
const P={
 memberships:()=>db.memberships.filter(m=>m.partner===myCo()),
 joined:()=>P.memberships().filter(m=>m.status==='Accepted'),
 deals:()=>db.deals.filter(d=>d.partner===myCo()).sort((a,b)=>b.submittedAt.localeCompare(a.submittedAt)),
 open:()=>db.programs.filter(p=>!P.memberships().some(m=>m.program===p.id&&m.status!=='Declined'))};
P.opps=()=>db.opps.filter(o=>o.partner===myCo()).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
const sendsOf=o=>db.deals.filter(d=>d.oppId===o.id).sort((a,b)=>a.submittedAt.localeCompare(b.submittedAt));
function oppState(o){const s=sendsOf(o);if(!s.length)return 'Not sent';if(s.some(d=>d.status==='In Salesforce'))return 'In Salesforce';if(s.some(d=>d.status==='Submitted'))return 'Waiting';return 'Declined'}
const when=s=>new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}).replace(', ',' ').replace(/, (\d+:)/,' at $1');
function duplicateOf(d){const host=hostOf(d.site);return db.deals.find(o=>o.id!==d.id&&vendorOf(o)===vendorOf(d)&&o.status!=='Declined'&&hostOf(o.site)===host)}

/* ---------- actions ---------- */
function startReview(id){const m=db.memberships.find(x=>x.id===id);m.status='Under review';m.reviewAt=new Date().toISOString();log(prog(m.program).vendor,m.partner,co(m.partner).name+'’s application is under review.');save();toast('Marked as under review. '+co(m.partner).name+' can see the new status.');render()}
function acceptRequest(id){const m=db.memberships.find(x=>x.id===id);m.status='Accepted';m.decidedAt=new Date().toISOString();log(prog(m.program).vendor,m.partner,co(m.partner).name+' joined the '+prog(m.program).name+'.');save();closeAll();toast(co(m.partner).name+' is now your partner in the '+prog(m.program).name+'.');render()}
function declineRequest(id,reason){const m=db.memberships.find(x=>x.id===id);m.status='Declined';m.reason=reason;m.decidedAt=new Date().toISOString();log(prog(m.program).vendor,m.partner,co(m.partner).name+'’s application was declined.');save();closeAll();toast('Application declined. '+co(m.partner).name+' sees your reason.');render()}
function addToSalesforce(id,btn){
 const d=db.deals.find(x=>x.id===id);if(!d||d.status!=='Submitted')return;
 if(!sfConnected()){toast('Connect Salesforce first. Then the deal is added.');return sfConnect(()=>addToSalesforce(id))}
 document.querySelectorAll(`[data-act="sf"][data-id="${id}"]`).forEach(b=>{b.disabled=true;b.innerHTML='<span class="spin"></span>Adding…'});
 setTimeout(()=>{const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz0123456789';let s='006Q8000';for(let i=0;i<7;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  Object.assign(d,{status:'In Salesforce',sfId:s,stage:'Discovery',decidedAt:new Date().toISOString()});log(vendorOf(d),d.partner,d.customer+' was added to Salesforce as an opportunity.');save();closeAll();toast(d.customer+' is in Salesforce ('+crm().org+') as opportunity '+s+'. '+co(d.partner).name+' was notified.');render();flash(d.id)},1100);
}
function declineDeal(id,reason){const d=db.deals.find(x=>x.id===id);Object.assign(d,{status:'Declined',reason,decidedAt:new Date().toISOString()});log(vendorOf(d),d.partner,'The '+d.customer+' deal was declined.');save();closeAll();toast('Deal declined. '+co(d.partner).name+' sees your reason.');render()}
function apply(programId,note){const m={id:uid('m'),partner:myCo(),program:programId,status:'Applied',appliedAt:new Date().toISOString(),note};db.memberships.push(m);log(prog(programId).vendor,myCo(),co(myCo()).name+' applied to the '+prog(programId).name+'.');save();closeAll();toast('Application sent to '+co(prog(programId).vendor).name+'. You’ll see their decision here.');render()}
function sendOpp(oppId,program,note){const o=db.opps.find(x=>x.id===oppId),p=prog(program);if(sendsOf(o).some(d=>d.program===program))return toast('Already sent to this program.');
 const d={id:uid('d'),oppId,ref:'DR-'+db.seq,partner:myCo(),program,customer:o.account,site:o.site,contact:o.contact,email:o.email,product:o.product,value:o.amount,close:o.close,need:o.need,note:note||'',status:'Submitted',submittedAt:new Date().toISOString(),source:o.source,sfSource:o.sfId||null};
 db.deals.push(d);log(p.vendor,myCo(),co(myCo()).name+' sent '+o.account+' to '+co(p.vendor).name+'.');save();closeAll();
 toast(o.account+' sent to '+co(p.vendor).name+' · '+when(d.submittedAt)+'.');if(filter.my&&filter.my!=='all'&&oppState(o)!==filter.my)filter.my='all';if(view!=='mydeals')go('mydeals');else render();flash(o.id)}
function submitDeal(v){const o={id:uid('o'),partner:myCo(),account:v.customer,site:v.site,contact:v.contact,email:v.email,product:v.product,amount:Number(v.value),close:v.close,need:v.need,stage:'Prospecting',source:'Manual',createdAt:new Date().toISOString()};db.opps.push(o);sendOpp(o.id,v.program,'')}

 if(sfFlow.step==='consent')return openModal(`<div class="sfbar">${SFI.replace('class="sfi"','').replace('#00A1E0','#fff')}salesforce</div><header><h2>Allow access?</h2><p>Signed in as <b>${esc(u.email)}</b> on ${esc(orgHost(sfFlow.env))}</p></header><div class="mbody"><p style="margin:0;color:var(--ink);font-size:14px">PartnerAssistant PRM is asking to:</p><ul class="scopes">${(vendor?['Create and update opportunities','Read accounts and contacts','Stay connected so deals sync automatically']:['Read your opportunities','Read accounts and contacts','Stay connected so updates sync automatically']).map(x=>`<li>${ic('check')}${x}</li>`).join('')}</ul></div><footer class="dfoot"><button class="btn btn-line" data-act="sf-deny">Deny</button><button class="btn btn-sf" data-act="sf-allow">Allow</button></footer>`);
 if(sfFlow.step==='wait')return openModal(`<div class="waiting" style="padding:40px 22px"><span class="spin"></span><h2 style="font-size:19px">Connecting to Salesforce…</h2><p style="margin:0;color:var(--muted)">${vendor?'Checking your opportunity fields.':'Reading your open opportunities.'}</p></div>`);
}
function sfAllow(){sfFlow.step='wait';sfModal();setTimeout(()=>{db.crm[myCo()]={connected:true,env:sfFlow.env,org:orgHost(sfFlow.env),user:me().email,at:new Date().toISOString()};save();const after=sfFlow.after;closeAll();render();toast('Salesforce connected: '+orgHost(sfFlow.env)+'.');if(after)setTimeout(after,250)},1200)}
function sfManage(){const c=crm(),vendor=session.role==='ppm',waiting=vendor?0:(db.sfOpps[myCo()]||[]).filter(x=>!db.opps.some(o=>o.sfId===x.id)).length;openModal(`<header><h2>Salesforce</h2><p>${vendor?'Accepted partner deals are added here as opportunities.':'Import open opportunities, then send them to your vendors.'}</p></header><div class="mbody"><div class="callout ok" style="margin-top:0">Connected · synced ${ago(c.syncedAt||c.at)}</div><dl class="kv"><dt>Org</dt><dd>${esc(c.org)}</dd><dt>Environment</dt><dd>${esc(c.env)}</dd><dt>Connected by</dt><dd>${esc(c.user)}</dd><dt>Since</dt><dd>${date(c.at)}</dd></dl>${waiting?`<div class="callout info">${waiting} open ${waiting===1?'opportunity isn’t':'opportunities aren’t'} in My deals yet.</div>`:''}</div><footer class="dfoot"><button class="btn btn-line" data-act="sf-disconnect">Disconnect</button><button class="btn btn-line" data-act="sf-sync" id="sf-sync">Sync now</button>${vendor?'':`<button class="btn btn-primary" data-act="sf-import">Import opportunities</button>`}</footer>`)}
function sfSync(){const b=$('#sf-sync');if(b){b.disabled=true;b.innerHTML='<span class="spin"></span>Syncing…'}setTimeout(()=>{db.crm[myCo()].syncedAt=new Date().toISOString();save();closeAll();render();toast('Salesforce synced. Everything is up to date.')},900)}
function sfChip(){return sfConnected()?`<button class="sf" data-act="sf-manage" title="Salesforce connected"><span>Salesforce · synced ${ago(crm().syncedAt||crm().at)}</span></button>`:`<button class="btn btn-sm sf-connect sf-cta" data-act="${session.role==='ppm'?'sf-connect':'sf-import'}" title="Connect Salesforce">${SFW}<span>Connect Salesforce</span></button>`}

const imported=x=>db.opps.find(o=>o.partner===myCo()&&(o.sfId===x.id||hostOf(o.site)===hostOf(x.site)));
function importModal(){
 if(!sfConnected())return sfConnect(importModal);
 const opps=db.sfOpps[myCo()]||[];
 openModal(`<header><h2>Import from Salesforce</h2><p>Open opportunities in ${esc(crm().org)}. Imported deals land in My deals, ready to send to any vendor.</p></header><form id="import-form" novalidate><div class="mbody">
 <div class="opps">${opps.map(o=>{const have=imported(o);return `<label class="opp ${have?'sent':''}"><input type="checkbox" name="opp" value="${o.id}" ${have?'disabled':''}><span><b>${esc(o.account)}</b><small>${esc(o.stage)} · Closes ${date(o.close)} · ${esc(o.contact)}</small>${have?`<small>Already in My deals</small>`:''}</span><span class="amt">${money(o.amount)}</span></label>`}).join('')}</div><p class="err" id="i-err"></p></div>
 <footer class="dfoot"><button type="button" class="btn btn-line" data-act="close">Cancel</button><button class="btn btn-primary" type="submit" id="i-send" disabled>Select opportunities</button></footer></form>`,'wide')}
function importSend(f){const ids=new FormData(f).getAll('opp');if(!ids.length){$('#i-err').textContent='Pick at least one opportunity.';return}
 const made=ids.map(id=>{const x=db.sfOpps[myCo()].find(y=>y.id===id);const o={id:uid('o'),partner:myCo(),account:x.account,site:x.site,contact:x.contact,email:x.email,product:x.product,amount:x.amount,close:x.close,stage:x.stage,need:x.need,source:'Salesforce',sfId:x.id,createdAt:new Date().toISOString()};db.opps.push(o);return o});
 db.crm[myCo()].syncedAt=new Date().toISOString();log(null,myCo(),'You imported '+made.length+(made.length===1?' opportunity':' opportunities')+' from Salesforce.');save();closeAll();
 toast(made.length+(made.length===1?' deal':' deals')+' imported. Choose Send to vendor on each one.');filter.my='Not sent';go('mydeals');made.forEach(o=>flash(o.id))}
/* ---------- notifications ---------- */
const notes=()=>db.activity.filter(a=>session.role==='ppm'?a.vendor===myCo():a.partner===myCo());
const unread=()=>{const seen=db.seen[session.role]||'';return notes().filter(a=>a.at>seen).length};
function togglePop(){const pop=$('#pop');if(!pop)return;if(!pop.hidden){pop.hidden=true;return}
 const list=notes().slice(0,8),seen=db.seen[session.role]||'';
 pop.innerHTML=`<header><b>Notifications</b><small>${list.length?'Latest first':''}</small></header>${list.length?`<ul>${list.map(a=>`<li class="${a.at>seen?'new':''}"><span class="dot"></span><span>${esc(a.text)}<time>${when(a.at)}</time></span></li>`).join('')}</ul>`:'<div class="empty">You’re all caught up.</div>'}`;
 pop.hidden=false;db.seen[session.role]=new Date().toISOString();save();const b=document.querySelector('.bell .bdot');if(b)b.remove()}

let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),4200)}
let lastFocus;
function openDrawer(html){lastFocus=document.activeElement;const s=$('#drawer');s.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;s.hidden=false;s.querySelector('button,a,input')?.focus()}
function openModal(html,cls=''){lastFocus=document.activeElement;const s=$('#modal');s.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false;s.querySelector('textarea,select,input,button')?.focus()}
function closeAll(){['#drawer','#modal'].forEach(q=>{const s=$(q);s.hidden=true;s.innerHTML=''});lastFocus?.focus?.()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden||!$('#drawer').hidden)closeAll();else if(!chatEl.hidden)toggleChat(false)}});
['#drawer','#modal'].forEach(q=>$(q).addEventListener('click',e=>{if(e.target===e.currentTarget)closeAll()}));
function flash(id){setTimeout(()=>{const el=document.querySelector(`[data-row="${id}"]`);if(el){el.classList.add('hl');el.scrollIntoView({block:'center',behavior:'smooth'})}},60)}

  ${auth.tab==='password'?`<div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" placeholder="Any password works in the demo"></div>`:''}
  <p class="err" id="em-err"></p><button class="btn btn-primary" style="width:100%" type="submit">${auth.tab==='link'?'Email me a sign-in link':'Sign in'}</button></form>

 else if(auth.step==='sso')body=`<button class="back" data-act="auth-step" data-step="methods">${ic('back')}Other sign-in options</button><h2>Single sign-on</h2><p>Use your company’s identity provider, such as Okta, Microsoft Entra ID, or Google Workspace.</p>
  <form id="sso-form" novalidate><div class="field"><label for="sso">Work email or company domain</label><input class="input" id="sso" value="${esc(USERS[auth.role].email.split('@')[1])}" required></div><p class="err" id="sso-err"></p><button class="btn btn-primary" style="width:100%" type="submit">Continue to your identity provider</button></form>`;
 else if(auth.step==='inbox')body=`<button class="back" data-act="auth-step" data-step="methods">${ic('back')}Use a different method</button><h2>Check your inbox</h2><p>We sent a sign-in link to <b>${esc(auth.email)}</b>. It expires in 15 minutes.</p><div class="callout info">In this demo, no email is sent. Open the link below to continue.</div><button class="btn btn-primary" style="width:100%" data-act="finish" data-method="Email link">Open the sign-in link</button>`;
 else if(auth.step==='wait')body=`<div class="waiting"><span class="spin"></span><h2 style="font-size:20px">Signing in with ${esc(auth.method)}…</h2><p style="margin:0;color:var(--muted)">You’ll land on your overview.</p></div>`;
 return `<div class="auth">${side}<main class="auth-main"><div class="auth-card">${body}</div></main></div>`;
}
function finish(method){auth.method=method;auth.step='wait';render();setTimeout(()=>{session={role:auth.role,method};saveSession();auth={step:'role',role:null,tab:'link'};view='home';history.replaceState(null,'','#home');render();toast('Signed in with '+method+'.')},900)}

/* ---------- shell ---------- */

 <nav class="nav" aria-label="Main">${nav.map(n=>link(n[0],n[1],n[2])).join('')}</nav>
 <div class="side-foot"><button class="btn btn-quiet" data-act="switch" style="justify-content:flex-start">${ic('swap')}View as ${vendor?'Partner Manager':'Partner Program Manager'}</button>

 ${sfChip()}
 <span class="bellwrap"><button class="iconbtn bell" data-act="bell" aria-label="Notifications" title="Notifications">${ic('bell')}${unread()?`<span class="bdot">${unread()}</span>`:''}</button><div class="pop" id="pop" hidden></div></span>
 <button class="iconbtn" data-act="theme" title="Switch light or dark" aria-label="Switch light or dark">${ic('moon')}</button>
 <button class="iconbtn mob-only" data-act="switch" title="Switch role" aria-label="View as the other role">${ic('swap')}</button>
 <button class="iconbtn mob-only" data-act="signout" title="Sign out" aria-label="Sign out">${ic('out')}</button></header>
 <main class="page" id="page">${content}</main></div></div>
 <nav class="tabbar" aria-label="Main">${nav.map(n=>link(n[0],n[1],n[2],true)).join('')}</nav>`;
}
const pillFor=s=>({'Applied':'p-applied','Submitted':'p-submitted','Under review':'p-review','Accepted':'p-ok','In Salesforce':'p-ok','Declined':'p-bad'}[s]||'p-review');

const seg=(key,opts,cur)=>`<div class="seg" role="group">${opts.map(([v,l,n])=>`<button data-act="filter" data-key="${key}" data-val="${v}" aria-pressed="${cur===v}">${l}${n!=null?`<em>${n}</em>`:''}</button>`).join('')}</div>`;
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};

/* ---------- rows ---------- */
function requestRow(m,compact){const p=prog(m.program),c=co(m.partner);
 const acts=m.status==='Applied'?`${compact?'':`<button class="btn btn-line btn-sm" data-act="review" data-id="${m.id}">Start review</button>`}<button class="btn btn-line btn-sm" data-act="decline-req" data-id="${m.id}">Decline</button><button class="btn btn-primary btn-sm" data-act="accept" data-id="${m.id}">Accept</button>`
 :m.status==='Under review'?`<button class="btn btn-line btn-sm" data-act="decline-req" data-id="${m.id}">Decline</button><button class="btn btn-primary btn-sm" data-act="accept" data-id="${m.id}">Accept</button>`:'';
 return `<div class="row" data-row="${m.id}"><button class="rmain" data-act="open-req" data-id="${m.id}"><span class="av">${ini(c.name)}</span><span class="rtext"><b>${esc(c.name)}</b><small>${compact?'Partnership request · ':''}${esc(p.name)} · ${esc(c.region)}</small><span class="meta">${pill(m.status)}<small>Applied ${ago(m.appliedAt)}</small></span></span></button><div class="ract">${acts}</div></div>`}
function dealRowVendor(d,compact){const c=co(d.partner),dup=d.status==='Submitted'&&duplicateOf(d);
 const check=d.status==='Submitted'?(dup?`<span class="flag warn">${ic('warn')}Possible duplicate</span>`:`<span class="flag ok">${ic('check')}No conflicts</span>`):'';
 const acts=d.status==='Submitted'?`<button class="btn btn-line btn-sm" data-act="decline-deal" data-id="${d.id}">Decline</button><button class="btn btn-sf btn-sm" data-act="sf" data-id="${d.id}">Add to Salesforce</button>`:d.status==='In Salesforce'?`<small style="color:var(--muted)">${esc(d.stage)} · ${esc(d.sfId)}</small>`:'';
 return `<div class="row" data-row="${d.id}"><button class="rmain" data-act="open-deal" data-id="${d.id}"><span class="av">${ini(d.customer)}</span><span class="rtext"><b>${esc(d.customer)}</b><small>${compact?'Deal · ':''}from ${esc(c.name)} · ${esc(d.product)}</small><span class="meta">${pill(d.status)}${check}<small>${d.status==='Submitted'?'Submitted '+ago(d.submittedAt):'Closes '+date(d.close)}</small></span></span></button><div class="ract"><span class="amt">${money(d.value)}</span>${acts}</div></div>`}
function dealSteps(d){const s=d.status,steps=['Submitted','Vendor review',s==='Declined'?'Declined':'In Salesforce'];const at=s==='Submitted'?1:2;
 return `<ol class="steps" aria-label="Status: ${esc(s)}">${steps.map((t,i)=>`<li class="${s==='Declined'&&i===2?'no':i<at||(i===2&&s==='In Salesforce')?'done':i===at?'now':''}">${t}</li>`).join('')}</ol>`}
function sendChip(d){const v=co(vendorOf(d)),lab=d.status==='Submitted'?'Waiting':d.status;return `<span class="sendchip ${pillFor(d.status)}" title="Sent ${esc(when(d.submittedAt))}">${esc(v.name)} · ${esc(lab)}</span>`}
function oppRow(o){const sends=sendsOf(o),last=sends[sends.length-1];
 return `<div class="row" data-row="${o.id}"><button class="rmain" data-act="open-opp" data-id="${o.id}"><span class="av">${ini(o.account)}</span><span class="rtext"><b>${esc(o.account)}</b><small>${o.source==='Salesforce'?`<span class="src">${SFI}From Salesforce</span>`:'<span class="src">Added manually</span>'} · ${esc(o.product)} · Closes ${date(o.close)}</small><span class="meta">${sends.length?sends.map(sendChip).join(''):pill('Not sent')}${last?`<small>Last sent ${ago(last.submittedAt)}</small>`:''}</span></span></button><div class="ract"><span class="amt">${money(o.amount)}</span><button class="btn ${sends.length?'btn-line':'btn-primary'} btn-sm" data-act="send-opp" data-id="${o.id}">${ic('send')}${sends.length?'Send to another vendor':'Send to vendor'}</button></div></div>`}
function dealRowPartner(d){return oppRow(db.opps.find(o=>o.id===d.oppId)||{})}
const feed=items=>items.length?`<ul class="feed">${items.slice(0,6).map(a=>`<li><span class="dot"></span><span>${esc(a.text)}<time>${ago(a.at)}</time></span></li>`).join('')}</ul>`:`<div class="empty">No activity yet.</div>`;

 const queue=[...w.map(m=>({at:m.appliedAt,html:requestRow(m,true)})),...nd.map(d=>({at:d.submittedAt,html:dealRowVendor(d,true)}))].sort((a,b)=>a.at.localeCompare(b.at));

const EXAMPLES=[{partner:'RedBlink Technologies',customer:'Helios Freight',product:'CodeConductor Platform',value:'$120,000',opp:'006Q8000012HlfR'},{partner:'Northbridge Consulting',customer:'Granite Peak Bank',product:'CodeConductor Platform',value:'$340,000',opp:'006Q8000013GpbK'},{partner:'Cobalt Systems',customer:'Kestrel Energy',product:'AI App Builder',value:'$140,000',opp:'006Q8000014KesN'}];
let sceneT=null,sceneStep=0,sceneEx=0;
const still=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function paintScene(){const panes=document.querySelectorAll('#stage .pane');if(!panes.length)return stopScene();panes.forEach((p,i)=>{p.classList.toggle('on',i===sceneStep);p.classList.toggle('done',i<sceneStep)});const ex=EXAMPLES[sceneEx];document.querySelectorAll('#stage [data-f]').forEach(el=>{el.textContent=ex[el.dataset.f]})}
function startScene(){const sc=$('#scene'),st=$('#stage');if(!sc)return;
 sc.onpointermove=e=>{if(still())return;const r=sc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;st.style.setProperty('--rx',(x*16).toFixed(2)+'deg');st.style.setProperty('--ry',(-y*12).toFixed(2)+'deg')};
 sc.onpointerleave=()=>{st.style.setProperty('--rx','0deg');st.style.setProperty('--ry','0deg')};
 document.querySelectorAll('#stage .pane').forEach(p=>p.onpointerenter=()=>{sceneStep=+p.dataset.pane;paintScene()});
 clearInterval(sceneT);if(still()){sceneStep=2;paintScene();return}
 paintScene();sceneT=setInterval(()=>{sceneStep++;if(sceneStep>2){sceneStep=0;sceneEx=(sceneEx+1)%EXAMPLES.length}paintScene()},1700)}
function stopScene(){clearInterval(sceneT);sceneT=null}

  return nd.length?`Which deal? These are waiting:${li(nd.map(d=>`${esc(d.customer)} · ${money(d.value)}`))}`:'There are no new deals to add right now.'}
 if(/\baccept|approve/.test(s)){const m=findName(s,waiting,x=>co(x.partner).name);if(m)return `Accept <b>${esc(co(m.partner).name)}</b> into the ${esc(prog(m.program).name)}?<br>${doBtn('Accept partner','accept',m.id)}`;
  return waiting.length?`Who should I accept? Waiting:${li(waiting.map(m=>esc(co(m.partner).name)))}`:'No partnership requests are waiting.'}
 if(/under review|reviewing/.test(s)){const r=waiting.filter(m=>m.status==='Under review');return r.length?`${r.length} under review:${li(r.map(m=>`${esc(co(m.partner).name)} · ${esc(prog(m.program).name)}`))}${goBtn('Open requests','requests')}`:'No applications are under review right now.'}
 if(/appl|request|join/.test(s)){const r=waiting.filter(m=>m.status==='Applied');return r.length?`${r.length} ${r.length===1?'partner has':'partners have'} applied:${li(r.map(m=>`${esc(co(m.partner).name)} · ${esc(prog(m.program).name)} · ${ago(m.appliedAt)}`))}${goBtn('Review requests','requests')}`:'No new applications.'}
 if(/deal|received|pipeline/.test(s))return nd.length?`${nd.length} new ${nd.length===1?'deal':'deals'} to review:${li(nd.map(d=>`${esc(d.customer)} · ${money(d.value)} · from ${esc(co(d.partner).name)}`))}${goBtn('Open received deals','received')}`:'No new deals right now.';
 if(/partner/.test(s)){const p=V.partners();return `You have ${p.length} partners:${li(p.map(id=>esc(co(id).name)))}${goBtn('Open my partners','partners')}`}
 if(/program/.test(s))return `Your programs:${li(V.programs().map(p=>esc(p.name)))}${goBtn('Open programs','programs')}`;
 return `I can help with partners, applications, and deals. Try “Which partners applied to my programs?” or “Show received deals.”`}
function parseDeal(q){const out={},m=q.match(/\$\s?(\d+(?:\.\d+)?)\s?(k|m)?\b/i)||q.match(/\b(\d+(?:\.\d+)?)\s?(k|m)\b/i);if(m)out.value=String(Math.round(Number(m[1])*(m[2]?.toLowerCase()==='m'?1e6:m[2]?1e3:1)));
 const c=q.match(/\b(?:with|for|at)\s+([A-Z][\w&.-]*(?:\s+[A-Z][\w&.-]*)*)/);if(c)out.customer=c[1];
 const months=['january','february','march','april','may','june','july','august','september','october','november','december'],mi=months.findIndex(x=>q.toLowerCase().includes(x));
 if(mi>=0){const now=new Date();let y=now.getFullYear();if(mi<now.getMonth())y++;out.close=new Date(Date.UTC(y,mi+1,0)).toISOString().slice(0,10)}
 if(out.customer)out.site=out.customer.toLowerCase().replace(/[^a-z0-9]/g,'')+'.com';return out}
function answerP(s,q){
 if(/salesforce|import|crm/.test(s)){if(!sfConnected())return `Your Salesforce isn’t connected yet. Connect it and I’ll bring in your open opportunities.<br><button class="btn btn-sf btn-sm" data-act="sf-connect">Connect Salesforce</button>`;const o=(db.sfOpps[myCo()]||[]).filter(x=>!imported(x));return o.length?`${o.length} Salesforce ${o.length===1?'opportunity isn’t':'opportunities aren’t'} in My deals yet:${li(o.map(x=>`${esc(x.account)} · ${money(x.amount)} · ${esc(x.stage)}`))}<button class="btn btn-primary btn-sm" data-act="sf-import">Import them</button>`:'All your Salesforce opportunities are already in My deals.'}
 if(/submit|register|new deal/.test(s)&&!/my submitted|show/.test(s)){if(!P.joined().length)return 'Join a vendor program first. Once they accept you, you can submit deals.';const pre=parseDeal(q);pre.program=P.joined()[0].program;
  const got=[pre.customer&&'customer: '+esc(pre.customer),pre.value&&'value: '+money(pre.value),pre.close&&'close: '+date(pre.close)].filter(Boolean);
  return `${got.length?`I filled in ${got.join(', ')}. `:''}Add the contact and what the customer needs, then submit.<br>${goBtn('Open the deal form','submit',pre)}`}
 if(/deal|status|submitted|sent/.test(s)){const d=P.opps();return d.length?`Your deals:${li(d.map(o=>{const ss=sendsOf(o);return `${esc(o.account)} · ${money(o.amount)} · ${ss.length?ss.map(x=>esc(co(vendorOf(x)).name)+' <b>'+esc(x.status==='Submitted'?'waiting':x.status)+'</b>').join(', '):'<b>not sent</b>'}`}))}${goBtn('Open my deals','mydeals')}`:'You don’t have any deals yet.'}
 if(/join|programs? can|find|apply/.test(s)){const o=P.open();return o.length?`You can apply to:${li(o.map(p=>`${esc(co(p.vendor).name)} · ${esc(p.name)}`))}${goBtn('Find programs','vendors')}`:'You’ve applied to every available program.'}
 if(/vendor|partner compan|program|partner/.test(s)){const j=P.joined(),a=P.memberships().filter(m=>['Applied','Under review'].includes(m.status));return `You partner with:${li(j.map(m=>`${esc(co(prog(m.program).vendor).name)} · ${esc(prog(m.program).name)}`))}${a.length?`Pending: ${a.map(m=>esc(co(prog(m.program).vendor).name)+' ('+esc(m.status)+')').join(', ')}.<br>`:''}${goBtn('Open my vendors','vendors')}`}
 return `I can submit deals, show your deal status, and list your vendors. Try “Submit a $50K deal with Chevron closing in March.”`}

try{const th=localStorage.getItem('pa-prm-theme');if(th)document.documentElement.dataset.theme=th}catch{}
const h=location.hash.slice(1);if(session&&NAV[session.role]?.some(n=>n[0]===h))view=h;
render();
})();
