name: Test and deploy PRM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check dist/app.js
          node --check dist/sales-workflow.js
      - name: Verify partner workflows
        run: node --test tests/*.test.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
